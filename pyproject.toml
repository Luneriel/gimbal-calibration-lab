[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gimbal-calibration-lab"
version = "0.4.0"
description = "Offline desktop laboratory for gimbal and camera–IMU calibration"
requires-python = ">=3.10,<3.14"
dependencies = [
  "PySide6==6.8.3",
  "pyvista==0.46.4",
  "pyvistaqt==0.11.3",
  "vtk==9.4.2",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "opencv-python-headless==4.12.0.88",
  "PyYAML==6.0.3",
]

[project.scripts]
gimbal-lab = "gimbal_lab.app:main"
gimbal-lab-experiment = "gimbal_lab.experiments.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gimbal_lab"]


